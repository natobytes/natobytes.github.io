<title>Not found — NatoBytes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<script>
  // GitHub Pages is case-sensitive and can't redirect server-side.
  // Old links use /farmaperto/…; the folder is now /FarmaPerto/….
  (function () {
    var p = location.pathname;
    if (/^\/farmaperto(\/|$)/i.test(p) && !/^\/FarmaPerto/.test(p)) {
      location.replace('/FarmaPerto' + p.replace(/^\/[Ff]arma[Pp]erto/, '') + location.search + location.hash);
    }
  })();
</script>
